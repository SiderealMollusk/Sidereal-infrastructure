name: Project Sync (issues -> ProjectV2 Backlog)

on:
  issues:
    types: [opened, labeled]

jobs:
  add-to-projectv2:
    runs-on: ubuntu-latest
    if: github.event.issue.pull_request == null
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync issue to ProjectV2
        id: sync
        env:
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          PROJECT_SYNC_TOKEN: ${{ secrets.PROJECT_SYNC_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API: https://api.github.com/graphql
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          TOKEN="${PROJECT_SYNC_TOKEN:-$GITHUB_TOKEN}"
          if [ -z "$TOKEN" ]; then
            echo "ERROR: No token available. Set PROJECT_SYNC_TOKEN or ensure GITHUB_TOKEN has project access." >&2
            exit 1
          fi

          # Helper to run GraphQL
          gql() {
            local q=$1
            local vars=$2
            curl -s -H "Authorization: bearer $TOKEN" -X POST -d "{\"query\":$q,\"variables\":$vars}" $GITHUB_API
          }

          # 1) Get the ProjectV2 id by project title from the repository
          read -r PROJECT_QUERY <<< '"query($owner:String!,$repo:String!){ repository(owner:$owner,name:$repo){ projectsV2(first:100){ nodes{ id title } } } }"'
          read -r PROJECT_VARS <<< "{\"owner\":\"$OWNER\",\"repo\":\"$REPO\"}"
          project_resp=$(gql "$PROJECT_QUERY" "$PROJECT_VARS")
          project_id=$(echo "$project_resp" | jq -r --arg NAME "$PROJECT_NAME" '.data.repository.projectsV2.nodes[] | select(.title==$NAME) | .id' || true)
          if [ -z "$project_id" ] || [ "$project_id" = "null" ]; then
            echo "ERROR: ProjectV2 named '$PROJECT_NAME' not found in $OWNER/$REPO" >&2
            exit 1
          fi
          echo "Found project id: $project_id"

          # 2) Get issue node id
          read -r ISSUE_QUERY <<< '"query($owner:String!,$repo:String!,$number:Int!){ repository(owner:$owner,name:$repo){ issue(number:$number){ id number } } }"'
          read -r ISSUE_VARS <<< "{\"owner\":\"$OWNER\",\"repo\":\"$REPO\",\"number\":$ISSUE_NUMBER}"
          issue_resp=$(gql "$ISSUE_QUERY" "$ISSUE_VARS")
          issue_node_id=$(echo "$issue_resp" | jq -r '.data.repository.issue.id')
          if [ -z "$issue_node_id" ] || [ "$issue_node_id" = "null" ]; then
            echo "ERROR: Could not fetch issue node id for $REPO#$ISSUE_NUMBER" >&2
            exit 1
          fi

          # 3) Check for existing project item linked to this issue
          read -r ITEMS_QUERY <<< '"query($projectId:ID!){ node(id:$projectId){ ... on ProjectV2{ items(first:250){ nodes{ id content{ __typename ... on Issue{ number } } } } } } }"'
          read -r ITEMS_VARS <<< "{\"projectId\":\"$project_id\"}"
          items_resp=$(gql "$ITEMS_QUERY" "$ITEMS_VARS")
          exists_item=$(echo "$items_resp" | jq -r --argjson num $ISSUE_NUMBER '.data.node.items.nodes[]? | select(.content!=null and .content.number == $num) | .id' || true)
          if [ -n "$exists_item" ]; then
            echo "Item already exists in project (item id=$exists_item); skipping"
            exit 0
          fi

          # 4) Add project item linking the issue
          read -r ADD_MUTATION <<< '"mutation($projectId:ID!,$contentId:ID!){ addProjectV2ItemById(input:{projectId:$projectId,contentId:$contentId}){ item{ id } } }"'
          read -r ADD_VARS <<< "{\"projectId\":\"$project_id\",\"contentId\":\"$issue_node_id\"}"
          add_resp=$(gql "$ADD_MUTATION" "$ADD_VARS")
          item_id=$(echo "$add_resp" | jq -r '.data.addProjectV2ItemById.item.id' || true)
          if [ -z "$item_id" ] || [ "$item_id" = "null" ]; then
            echo "ERROR: failed to add project item: $add_resp" >&2
            exit 1
          fi
          echo "Created project item id: $item_id"

          # 5) Find Status single-select field id and the option id for 'Backlog'
          read -r FIELDS_QUERY <<< '"query($projectId:ID!){ node(id:$projectId){ ... on ProjectV2{ fields(first:50){ nodes{ __typename ... on ProjectV2SingleSelectField{ id name options{ id name } } } } } } }"'
          read -r FIELDS_VARS <<< "{\"projectId\":\"$project_id\"}"
          fields_resp=$(gql "$FIELDS_QUERY" "$FIELDS_VARS")
          field_id=$(echo "$fields_resp" | jq -r '.data.node.fields.nodes[] | select(.name=="Status") | .id' || true)
          option_id=$(echo "$fields_resp" | jq -r --arg OPT "Backlog" '.data.node.fields.nodes[]?.options[]? | select(.name==$OPT) | .id' || true)
          if [ -z "$field_id" ] || [ -z "$option_id" ]; then
            echo "WARNING: Status field or Backlog option not found; skipping field set" >&2
            echo "Done (item created but Status not set)"
            exit 0
          fi

          # 6) Set Status to Backlog
          read -r UPDATE_MUTATION <<< '"mutation($projectId:ID!,$itemId:ID!,$fieldId:ID!,$optionId:String!){ updateProjectV2ItemFieldValue(input:{projectId:$projectId,itemId:$itemId,fieldId:$fieldId,value:{singleSelectOptionId:$optionId}}){ projectV2Item{ id } } }"'
          read -r UPDATE_VARS <<< "{\"projectId\":\"$project_id\",\"itemId\":\"$item_id\",\"fieldId\":\"$field_id\",\"optionId\":\"$option_id\"}"
          update_resp=$(gql "$UPDATE_MUTATION" "$UPDATE_VARS")
          echo "Set Status to Backlog for item $item_id"

          echo "project_item_id=$item_id" >> $GITHUB_OUTPUT

      - name: Done
        run: echo "ProjectV2 sync complete"

# Notes:
# - This workflow uses GitHub's GraphQL ProjectV2 API and requires project write access via PROJECT_SYNC_TOKEN
# - Set repository variable PROJECT_NAME to the ProjectV2 title (e.g., 'Sidereal Infrastructure Board')
# - The workflow prefers PROJECT_SYNC_TOKEN (fine-grained PAT) and falls back to GITHUB_TOKEN
